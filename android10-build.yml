name: Zomdroid Android 10 compatibility build

on:
  workflow_dispatch:
  push:
    branches:
      - android10-compat

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package metadata
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "^(package:|sdkVersion:)"
          echo "$BADGING" | grep -q "^package: name='com.zomdroid.android10'"
          echo "$BADGING" | grep -q "^sdkVersion:'29'$"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Android 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: zomdroid-android10-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
